<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Bitácora de Incidencias</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-journal-text"></i> Bitácora de Incidencias</span>
            <div class="navbar-nav ms-auto">
                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i> <span id="userInfo">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><button class="dropdown-item" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar p-0">
                <div class="position-sticky">
                    <ul class="nav flex-column pt-3" id="sidebarNav"></ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Dashboard</h2>
                    <div class="d-flex gap-2">
                        <input type="date" class="form-control form-control-sm" id="fechaDesde">
                        <input type="date" class="form-control form-control-sm" id="fechaHasta">
                        <select class="form-select form-select-sm" id="filtroTipoCentro">
                            <option value="">Todos</option>
                            <option value="DISTRIBUCION">Distribución</option>
                            <option value="TRANSFERENCIA">Transferencia</option>
                        </select>
                        <button class="btn btn-sm btn-danger" id="btnFiltrar">Filtrar</button>
                    </div>
                </div>

                <div id="alertContainer"></div>
                <div id="toastContainer" class="toast-container"></div>

                <!-- KPIs -->
                <div class="row mb-4" id="kpisContainer">
                    <!-- Se cargan dinámicamente -->
                </div>

                <!-- Gráficos -->
                <div class="row g-4">
                    <div class="col-lg-6">
                        <div class="card h-100">
                            <div class="card-header bg-white">
                                <h6 class="mb-0">Incidencias por Día (Últimos 30 días)</h6>
                            </div>
                            <div class="card-body">
                                <canvas id="chartPorDia"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="card h-100">
                            <div class="card-header bg-white">
                                <h6 class="mb-0">Top 10 Sistemas con más Incidencias</h6>
                            </div>
                            <div class="card-body">
                                <canvas id="chartPorSistema"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="card h-100">
                            <div class="card-header bg-white">
                                <h6 class="mb-0">Distribución por Tipo de Centro</h6>
                            </div>
                            <div class="card-body">
                                <canvas id="chartPorTipoCentro"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="card h-100">
                            <div class="card-header bg-white">
                                <h6 class="mb-0">Incidencias por Centro</h6>
                            </div>
                            <div class="card-body">
                                <canvas id="chartPorCentro"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="card h-100">
                            <div class="card-header bg-white">
                                <h6 class="mb-0">Top Tipos de Incidencia</h6>
                            </div>
                            <div class="card-body">
                                <canvas id="chartPorTipoIncidencia"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="card h-100">
                            <div class="card-header bg-white">
                                <h6 class="mb-0">Top Responsables Actuales</h6>
                            </div>
                            <div class="card-body">
                                <canvas id="chartPorResponsable"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
