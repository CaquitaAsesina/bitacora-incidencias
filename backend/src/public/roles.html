<!DOCTYPE html>
<!--
  roles.html — Gestión de roles (CRUD, asignar rol a usuario, usuarios del rol).
  Scripts (en orden): api.js -> layout.js -> roles.js.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roles - Bitácora de Incidencias</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-journal-text"></i> Bitácora de Incidencias</span>
            <div class="navbar-nav ms-auto">
                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i> <span id="userInfo">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><button class="dropdown-item" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar p-0">
                <div class="position-sticky">
                    <ul class="nav flex-column pt-3" id="sidebarNav"></ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Roles</h2>
                    <div>
                        <button class="btn btn-danger" id="btnNuevoRol" style="display: none;">
                            <i class="bi bi-plus-circle"></i> Crear Rol
                        </button>
                        <button class="btn btn-primary" id="btnAsignarRolUsuario" style="display: none;">
                            <i class="bi bi-person-plus"></i> Asignar Rol a Usuario
                        </button>
                    </div>
                </div>

                <div class="card mb-3">
                    <div class="card-header bg-light">
                        <i class="bi bi-funnel"></i> <strong>Filtros</strong>
                    </div>
                    <div class="card-body">
                        <div class="row g-2">
                            <div class="col-6 col-md-4 col-lg-3">
                                <label class="form-label mb-1 small">Nombre del rol</label>
                                <input type="text" class="form-control form-control-sm" id="filtroNombreRol" placeholder="nombre">
                            </div>
                            <div class="col-6 col-md-4 col-lg-3">
                                <label class="form-label mb-1 small">Tipo</label>
                                <select class="form-select form-select-sm" id="filtroTipoRol">
                                    <option value="">Todos</option>
                                    <option value="SISTEMA">SISTEMA</option>
                                    <option value="PERSONALIZADO">PERSONALIZADO</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-2">
                            <button class="btn btn-sm btn-secondary" id="btnLimpiarFiltrosRoles">
                                <i class="bi bi-x-circle"></i> Limpiar filtros
                            </button>
                            <span class="ms-2 text-muted small" id="contadorRoles"></span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="bg-danger text-white">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Tipo</th>
                                        <th>Usuarios</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaRolesBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="modalRol" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalRolTitle">Nuevo Rol</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formRol">
                        <input type="hidden" id="rolId">
                        <div class="mb-3">
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control" id="nombreRol" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo *</label>
                            <select class="form-select" id="tipoRol" required>
                                <option value="SISTEMA">SISTEMA</option>
                                <option value="PERSONALIZADO">PERSONALIZADO</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnGuardarRol">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalAsignarRolUsuario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Asignar Rol a Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Usuario *</label>
                        <select class="form-select" id="selectUsuarioAsignar" required></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol *</label>
                        <select class="form-select" id="selectRolAsignar" required></select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnGuardarAsignarRolUsuario">Asignar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalUsuariosRol" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalUsuariosRolTitle">Usuarios del Rol</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="usuariosRolVacio" class="text-center text-muted py-3" style="display: none;">
                        Ningún usuario tiene este rol asignado.
                    </div>
                    <div class="table-responsive">
                        <table class="table table-sm table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Usuario</th>
                                    <th>Nombre</th>
                                    <th>Email</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaUsuariosRolBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/roles.js"></script>
</body>
</html>
