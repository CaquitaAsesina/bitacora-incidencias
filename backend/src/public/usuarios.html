<!DOCTYPE html>
<!--
  usuarios.html — Gestión de usuarios (listado con filtros, alta/edición, borrado).
  Scripts (en orden): api.js -> layout.js -> usuarios.js.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Bitácora de Incidencias</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-journal-text"></i> Bitácora de Incidencias</span>
            <div class="navbar-nav ms-auto">
                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i> <span id="userInfo">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><button class="dropdown-item" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar p-0">
                <div class="position-sticky">
                    <ul class="nav flex-column pt-3" id="sidebarNav"></ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Usuarios</h2>
                    <button class="btn btn-danger" id="btnNuevoUsuario" style="display: none;">
                        <i class="bi bi-plus-circle"></i> Nuevo Usuario
                    </button>
                </div>

                <div class="card mb-3">
                    <div class="card-header bg-light">
                        <i class="bi bi-funnel"></i> <strong>Filtros</strong>
                    </div>
                    <div class="card-body">
                        <div class="row g-2">
                            <div class="col-6 col-md-4 col-lg-2">
                                <label class="form-label mb-1 small">Usuario</label>
                                <input type="text" class="form-control form-control-sm" id="filtroUsuario" placeholder="usuario">
                            </div>
                            <div class="col-6 col-md-4 col-lg-2">
                                <label class="form-label mb-1 small">Nombre</label>
                                <input type="text" class="form-control form-control-sm" id="filtroNombre" placeholder="nombre">
                            </div>
                            <div class="col-6 col-md-4 col-lg-2">
                                <label class="form-label mb-1 small">Email</label>
                                <input type="text" class="form-control form-control-sm" id="filtroEmail" placeholder="email">
                            </div>
                            <div class="col-6 col-md-4 col-lg-2">
                                <label class="form-label mb-1 small">Teléfono</label>
                                <input type="text" class="form-control form-control-sm" id="filtroTelefono" placeholder="teléfono">
                            </div>
                            <div class="col-6 col-md-4 col-lg-2">
                                <label class="form-label mb-1 small">Rol</label>
                                <select class="form-select form-select-sm" id="filtroRol">
                                    <option value="">Todos</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-4 col-lg-2">
                                <label class="form-label mb-1 small">Habilitado</label>
                                <select class="form-select form-select-sm" id="filtroHabilitado">
                                    <option value="">Todos</option>
                                    <option value="1">Sí</option>
                                    <option value="0">No</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-2">
                            <button class="btn btn-sm btn-secondary" id="btnLimpiarFiltrosUsuarios">
                                <i class="bi bi-x-circle"></i> Limpiar filtros
                            </button>
                            <span class="ms-2 text-muted small" id="contadorUsuarios"></span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="bg-danger text-white">
                                    <tr>
                                        <th>ID</th>
                                        <th>Usuario</th>
                                        <th>Nombre</th>
                                        <th>Apellido</th>
                                        <th>Email</th>
                                        <th>Teléfono</th>
                                        <th>Habilitado</th>
                                        <th>Rol</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaUsuariosBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="modalUsuario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalUsuarioTitle">Nuevo Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formUsuario">
                        <div class="mb-3">
                            <label class="form-label">Usuario *</label>
                            <input type="text" class="form-control" id="usuario" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Apellido *</label>
                            <input type="text" class="form-control" id="apellido" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" class="form-control" id="telefono">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Habilitado</label>
                            <select class="form-select" id="habilitado">
                                <option value="true">Sí</option>
                                <option value="false">No</option>
                            </select>
                        </div>
                        <div class="mb-3" id="passwordGroup">
                            <label class="form-label">Contraseña *</label>
                            <input type="password" class="form-control" id="contrasena" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnGuardarUsuario">Guardar</button>
                </div>
            </div>
        </div>
    </div>


    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/usuarios.js"></script>
</body>
</html>
