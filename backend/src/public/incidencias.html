<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidencias - Bitácora de Incidencias</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-journal-text"></i> Bitácora de Incidencias</span>
            <div class="navbar-nav ms-auto">
                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i> <span id="userInfo">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><button class="dropdown-item" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar p-0">
                <div class="position-sticky">
                    <ul class="nav flex-column pt-3" id="sidebarNav"></ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Incidencias</h2>
                    <button class="btn btn-danger" id="btnNuevaIncidencia" style="display: none;">
                        <i class="bi bi-plus-circle"></i> Nueva Incidencia
                    </button>
                </div>

                <div class="card mb-4">
                    <div class="card-body">
                        <h6 class="card-title">Filtros Avanzados</h6>
                        <div class="row g-3">
                            <div class="col-md-2">
                                <label class="form-label form-label-sm">Desde</label>
                                <input type="date" class="form-control form-control-sm" id="filtroDesde">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label form-label-sm">Hasta</label>
                                <input type="date" class="form-control form-control-sm" id="filtroHasta">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label form-label-sm">Tipo Centro</label>
                                <select class="form-select form-select-sm" id="filtroTipoCentro">
                                    <option value="">Todos</option>
                                    <option value="DISTRIBUCION">Distribución</option>
                                    <option value="TRANSFERENCIA">Transferencia</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label form-label-sm">Estado</label>
                                <select class="form-select form-select-sm" id="filtroEstado">
                                    <option value="">Todos</option>
                                    <option value="abierta">Abierta</option>
                                    <option value="cerrada">Cerrada</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label form-label-sm">Usuario ID (Resp. Actual)</label>
                                <input type="number" class="form-control form-control-sm" id="filtroUsuarioId" placeholder="ID">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label form-label-sm">Resp. (Texto Libre)</label>
                                <input type="text" class="form-control form-control-sm" id="filtroRespTexto" placeholder="Texto">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label form-label-sm">Centro</label>
                                <input type="text" class="form-control form-control-sm" id="filtroCentro" placeholder="Buscar centro">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label form-label-sm">Sistema</label>
                                <input type="text" class="form-control form-control-sm" id="filtroSistema" placeholder="Buscar sistema">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label form-label-sm">Incidencia</label>
                                <input type="text" class="form-control form-control-sm" id="filtroIncidencia" placeholder="Tipo incidencia">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label form-label-sm">Buscar (Ticket/Descripción)</label>
                                <input type="text" class="form-control form-control-sm" id="filtroQ" placeholder="Buscar...">
                            </div>
                        </div>
                        <div class="mt-3">
                            <button class="btn btn-danger btn-sm" id="btnFiltrar">Aplicar Filtros</button>
                            <button class="btn btn-secondary btn-sm" id="btnLimpiar">Limpiar</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="bg-danger text-white">
                                    <tr>
                                        <th>ID</th>
                                        <th>Ticket</th>
                                        <th>Fecha</th>
                                        <th>Tipo Centro</th>
                                        <th>Centro</th>
                                        <th>Sistema</th>
                                        <th>Incidencia</th>
                                        <th>Resp. Actual</th>
                                        <th>Resp. (Texto)</th>
                                        <th>Estado</th>
                                        <th>Hora Inicio</th>
                                        <th>Hora Fin</th>
                                        <th>Tiempo Solución</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaIncidenciasBody"></tbody>
                            </table>
                        </div>
                        <nav>
                            <ul class="pagination" id="paginacion"></ul>
                        </nav>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Nueva Incidencia -->
    <div class="modal fade" id="modalIncidencia" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Nueva Incidencia</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formIncidencia" novalidate>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Tipo Centro *</label>
                                <select class="form-select" id="tipoCentro" required>
                                    <option value="">Seleccionar...</option>
                                    <option value="DISTRIBUCION">DISTRIBUCION</option>
                                    <option value="TRANSFERENCIA">TRANSFERENCIA</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Centro *</label>
                                <input type="text" class="form-control" id="centro" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Sistema *</label>
                                <input type="text" class="form-control" id="sistema" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Incidencia *</label>
                                <input type="text" class="form-control" id="incidencia" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Ticket *</label>
                                <input type="text" class="form-control" id="ticket" maxlength="59" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Responsable (Texto libre) *</label>
                                <input type="text" class="form-control" id="responsable" maxlength="60" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Descripción *</label>
                                <textarea class="form-control" id="descripcion" rows="3" maxlength="255" required></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnGuardarIncidencia">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/incidencias.js"></script>
</body>
</html>
