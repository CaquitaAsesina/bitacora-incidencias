<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permisos - Bitácora de Incidencias</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-journal-text"></i> Bitácora de Incidencias</span>
            <div class="navbar-nav ms-auto">
                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i> <span id="userInfo">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><button class="dropdown-item" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar p-0">
                <div class="position-sticky">
                    <ul class="nav flex-column pt-3" id="sidebarNav"></ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Permisos</h2>
                    <div class="d-flex gap-2">
                        <button class="btn btn-danger" id="btnNuevoPermiso" style="display: none;">
                            <i class="bi bi-plus-circle"></i> Crear Permiso
                        </button>
                        <button class="btn btn-primary" id="btnAsignarPermisosRol" style="display: none;">
                            <i class="bi bi-key"></i> Asignar a Rol SISTEMA
                        </button>
                        <button class="btn btn-warning" id="btnAsignarPermisosUsuario" style="display: none;">
                            <i class="bi bi-person-gear"></i> Asignar a Usuario (Rol PERSONALIZADO)
                        </button>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-body">
                        <h6 class="card-title">Filtros</h6>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label form-label-sm">Buscar por nombre</label>
                                <input type="text" class="form-control form-control-sm" id="filtroNombre"
                                    placeholder="Ej. VER_USUARIOS">
                            </div>
                        </div>
                        <div class="mt-3">
                            <button class="btn btn-danger btn-sm" id="btnFiltrar">Buscar</button>
                            <button class="btn btn-secondary btn-sm" id="btnLimpiar">Limpiar</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="bg-danger text-white">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaPermisosBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Crear Permiso -->
    <div class="modal fade" id="modalPermiso" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalPermisoTitle">Nuevo Permiso</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formPermiso">
                        <input type="hidden" id="permisoId">
                        <div class="mb-3">
                            <label class="form-label">Nombre del Permiso *</label>
                            <input type="text" class="form-control" id="nombrePermiso" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnGuardarPermiso">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Asignar a Rol SISTEMA -->
    <div class="modal fade" id="modalAsignarPermisosRol" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Asignar Permisos a Rol SISTEMA</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Rol SISTEMA *</label>
                        <select class="form-select" id="selectRolSistema"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Permisos asignados actualmente</label>
                        <div id="permisosRolAsignados" class="d-flex flex-column gap-2 mb-2"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Permisos del catálogo</label>
                        <div id="permisosRolContainer" style="max-height: 300px; overflow-y: auto;"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnGuardarAsignacionRol">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Asignar a Usuario (Rol PERSONALIZADO) -->
    <div class="modal fade" id="modalAsignarPermisosUsuario" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Asignar Permisos a Usuario (Rol PERSONALIZADO)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Usuario *</label>
                        <select class="form-select" id="selectUsuarioPerm"></select>
                        <div class="form-text">
                            Se usa el rol PERSONALIZADO del usuario. Si no tiene ninguno asignado no se podrán agregar permisos.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol PERSONALIZADO</label>
                        <input type="text" class="form-control" id="rolPersonalizadoResuelto" readonly
                               placeholder="Seleccione un usuario para ver su rol">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Permisos asignados actualmente</label>
                        <div id="permisosUsuarioAsignados" class="d-flex flex-column gap-2 mb-2"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Permisos del catálogo</label>
                        <div id="permisosUsuarioContainer" style="max-height: 300px; overflow-y: auto;"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnGuardarAsignacionUsuario">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/permisos.js"></script>
</body>
</html>
