# =====================================================================
# render.yml — Blueprint de despliegue en Render
# =====================================================================
# Uso: en Render, crear un Blueprint (New + > Blueprint) apuntando a este
# repositorio y usar el render.yml de la raíz (Render lo detecta solo en
# el *root* con el nombre render.yaml o render.yml).
#
# El frontend se sirve desde la carpeta /frontend por el propio Express,
# por eso el build y el start se ejecutan desde la raíz del repo con
# `cd backend` (así /frontend queda disponible en el runtime).
#
# La base de datos es un MySQL externo (Aiven); Render no ofrece MySQL.
# Las credenciales NO se escriben aquí: se configuran como variables de
# entorno del servicio (sync: false = Render las pedirá en el dashboard).
# =====================================================================

services:
  - type: web
    name: bitacora-incidencias
    runtime: node
    plan: free
    region: frankfurt # cercana a la BD MySQL (Aiven, Frankfurt)
    branch: incidencias
    autoDeployTrigger: commit
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_NAME
        value: bitacora_incidencias
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      # REQUIRED = TLS activo (Aiven lo exige). En el dashboard puede
      # sobreescribirse con false/0 para un MySQL local sin cifrado.
      - key: DB_SSL
        value: REQUIRED
      # Ruta de la CA, resuelta por db.js relativa a backend/.
      - key: DB_SSL_CA
        value: certs/ca.pem
