<!DOCTYPE html>
<!--
  index.html — Login.
  Scripts (en orden): api.js (base) -> ui.js (control visual) -> auth.js (sesión/formulario).
  Si ya hay sesión, redirige a la primera página permitida.
  Los ids funcionales (loginForm, alertContainer, loginSpinner, usuario,
  contrasena) se conservan sin cambios.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bitácora de Incidencias — acceso al sistema de gestión de incidencias.">
    <title>Iniciar Sesión · Bitácora de Incidencias</title>

    <!-- Iconos y logo -->
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/logo-isotipo.png">

    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 + iconos + tema de la app (orden obligatorio) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="ui-pagina-login">

    <!-- ================= Overlay de arranque (boot) ================= -->
    <div class="ui-overlay ui-overlay--boot ui-overlay--visible" id="uiBootOverlay"
         role="status" aria-live="polite" aria-hidden="false">
        <div class="ui-overlay__panel">
            <img src="img/logo-farmacias-peruanas.png" alt="Farmacias Peruanas" class="ui-overlay__logo">
            <p class="ui-overlay__titulo">Cargando sistema…</p>
            <div class="ui-overlay__barra" role="presentation"></div>
        </div>
    </div>

    <!-- ================= Overlay de inicio de sesión (verde) ================= -->
    <div class="ui-overlay ui-overlay--login ui-overlay--oculto" id="uiLoginOverlay"
         role="status" aria-live="polite" aria-hidden="true">
        <div class="ui-overlay__panel">
            <img src="img/logo-farmacias-peruanas.png" alt="Farmacias Peruanas" class="ui-overlay__logo">
            <span class="ui-overlay__spinner" aria-hidden="true"></span>
            <p class="ui-overlay__titulo">Iniciando sesión…</p>
            <p class="ui-overlay__texto">Validando credenciales</p>
        </div>
    </div>

    <!-- ================= Contenido: formulario de acceso ================= -->
    <main class="ui-login-wrap">
        <div class="ui-login-card">

            <div class="ui-login-card__cabecera">
                <img src="img/logo-farmacias-peruanas.png" alt="Farmacias Peruanas" class="ui-login-card__logo">
                <h1 class="ui-login-card__titulo">Bitácora de Incidencias</h1>
                <p class="ui-login-card__subtitulo">Gestión y seguimiento de incidencias de IG</p>
            </div>

            <div class="ui-login-card__cuerpo">
                <!-- Mensajes de error/validación (se rellenan desde auth.js) -->
                <div id="alertContainer"></div>

                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <div class="ui-input-icono">
                            <i class="bi bi-person" aria-hidden="true"></i>
                            <input type="text" class="form-control" id="usuario"
                                   autocomplete="username" placeholder="Ingrese su usuario" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <div class="ui-input-icono">
                            <i class="bi bi-shield-lock" aria-hidden="true"></i>
                            <input type="password" class="form-control" id="contrasena"
                                   autocomplete="current-password" placeholder="Ingrese su contraseña" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>
                        Iniciar Sesión
                    </button>
                </form>
            </div>

            <div class="ui-footer text-center">
                <span class="ui-footer__marca">
                    <img src="img/logo-isotipo.png" alt="" class="ui-logo-footer">
                    Farmacias Peruanas
                </span>
                <div class="mt-1">Ingenieria Logística · Sistema interno</div>
            </div>

        </div>
    </main>

    <!-- Bootstrap Bundle (incluye Popper) + scripts de la app, en orden -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/auth.js" defer></script>
</body>
</html>
